name: CI and release

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile sources
        run: python -m compileall -q apt_mirror tests
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    name: Build Debian package
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools
      - name: Build binary package
        run: dpkg-buildpackage --no-sign --build=binary
      - name: Collect package outputs
        run: |
          mkdir -p dist
          cp ../apt-mirror-py_*.deb ../apt-mirror-py_*.changes \
            ../apt-mirror-py_*.buildinfo dist/
      - uses: actions/upload-artifact@v7
        with:
          name: apt-mirror-py-debian-package
          path: dist/
          if-no-files-found: error

  package-smoke:
    name: Install on ${{ matrix.name }}
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12-slim
          - name: Ubuntu 24.04
            image: ubuntu:24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apt-mirror-py-debian-package
          path: dist
      - name: Install and exercise package
        run: |
          apt-get update
          apt-get install --no-install-recommends -y python3 ./dist/*.deb
          apt-mirror-py --help >/dev/null
          python3 -c 'import apt_mirror'

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, package-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apt-mirror-py-debian-package
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
